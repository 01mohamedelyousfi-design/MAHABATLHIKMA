<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة غير موجودة — 404 | محبة الحكمة</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/assets/logo/logo-mark.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8fffe 0%, #f0fdfa 50%, #f5f3ff 100%);
            color: #1e293b;
            text-align: center;
            padding: 2rem;
        }
        .container {
            max-width: 520px;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #0f766e 0%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 1.75rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.125rem;
            color: #64748b;
            line-height: 1.8;
            margin-bottom: 2rem;
        }
        .home-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #0f766e, #0d5f58);
            color: white;
            padding: 0.875rem 2rem;
            border-radius: 1rem;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.125rem;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 14px rgba(15, 118, 110, 0.25);
        }
        .home-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(15, 118, 110, 0.35);
        }
        .owl {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="owl" role="img" aria-label="بومة الحكمة">🦉</span>
        <div class="error-code">404</div>
        <h1>الصفحة غير موجودة</h1>
        <p>يبدو أن هذه الصفحة لم تُكتشف بعد — حتى أرسطو لم يكن يعرف كل شيء!</p>
        <a href="/" class="home-link">
            العودة إلى الصفحة الرئيسية ←
        </a>
    </div>
</body>
</html>
